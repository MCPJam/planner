<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner — MCPJam</title><style>/*CSS*/</style></head><body><header><div class="brand">mcpjam<span> / planner</span></div><div class="toolbar"><span id="mode" class="fine"></span><a href="/" id="reconnect">Reconnect</a></div></header><section class="intro"><h1>Your week.</h1><div class="toolbar"><button id="prev" aria-label="Previous week">←</button><input id="week" type="date" value="2026-09-14" min="2026-01-01" max="2027-12-31" aria-label="Week"><button id="next" aria-label="Next week">→</button><span class="fine">UTC</span></div></section><div id="status" role="status" aria-live="polite"></div><main class="layout"><aside class="sidebar"><label for="priority" class="fine">PRIORITY</label><select id="priority"><option>Launch Orion</option><option>Customer research</option><option>Platform reliability</option><option>Team operations</option><option>Personal growth</option></select><button class="primary" id="replan">Re-plan week ↗</button><div class="backlog-heading"><h2>To schedule</h2><span id="backlog-count" class="fine"></span></div><div id="backlog"></div></aside><div class="calendar-wrap"><div class="calendar" id="calendar"></div><div class="below-calendar"><details id="connection"><summary>Connect</summary><p id="connect-info" class="fine"></p><button id="copy-token">Copy token</button><details><summary>Activity</summary><button id="traces">Refresh</button><pre id="activity"></pre></details></details><details><summary>Feedback</summary><div class="toolbar"><button data-rating="useful">Useful</button><button data-rating="partial">Partly</button><button data-rating="not_useful">Not useful</button></div></details><span class="fine">Demo data</span></div></div></main><dialog id="editor"><form method="dialog" id="edit-form"><h2>Edit event</h2><label>Title<input id="edit-title" required maxlength="180"></label><label>Date<input id="edit-date" type="date" min="2026-01-01" max="2027-12-31" required></label><label>Time · UTC<input id="edit-time" type="time" min="09:00" max="16:45" step="900" required></label><label>Minutes<input id="edit-duration" type="number" min="15" max="180" step="15" required></label><div class="toolbar"><button type="button" id="cancel-edit">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><script type="module">/*JS*/</script></body></html>
