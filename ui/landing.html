<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Planner — MCPJam</title>
    <style>
      /*CSS*/
    </style>
  </head>
  <body>
    <header>
      <div class="brand">mcpjam<span> / planner</span></div>
    </header>
    <main class="consent">
      <div class="consent-heading">
        <h1>Make time for<br />what matters.</h1>
        <p>Plan your week. Move things around.</p>
      </div>
      <form action="/consent" method="post" id="consent-form">
        <h2>Connect your planner</h2>
        <input id="oauth" name="oauth" type="hidden" />
        <div class="choices">
          <label class="choice"
            ><input type="radio" name="mode" value="simple" checked />
            <div>
              <b>Simple tools</b>
              <p>One tool for each job.</p>
            </div>
            <small>01</small></label
          ><label class="choice"
            ><input type="radio" name="mode" value="context" />
            <div>
              <b>Tools with context</b>
              <p>Includes your goal and session context.</p>
            </div>
            <small>02</small></label
          ><label class="choice"
            ><input type="radio" name="mode" value="discovery" />
            <div>
              <b>Search + execute</b>
              <p>Find the right tool, then run it.</p>
            </div>
            <small>03</small></label
          >
        </div>
        <button class="primary connect-button" type="submit">Connect →</button>
        <p class="fine" id="consent-status">
          Demo data only. No account needed.
        </p>
        <details>
          <summary>MCP connection</summary>
          <code id="endpoint"></code>
          <p class="fine">
            Use this URL in your MCP client. Reconnect to change tools.
          </p>
        </details>
      </form>
    </main>
    <script>
      document.getElementById("oauth").value =
        location.pathname === "/authorize" ? location.search.slice(1) : "";
      document.getElementById("endpoint").textContent =
        location.origin + "/mcp";
      document
        .getElementById("consent-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const button = e.target.querySelector("button");
          button.disabled = true;
          button.textContent = "Connecting…";
          try {
            const r = await fetch("/consent", {
              method: "POST",
              body: new FormData(e.target),
              headers: { Accept: "application/json" },
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || "Connection failed");
            location.href = data.redirect;
          } catch (error) {
            document.getElementById("consent-status").textContent =
              error.message;
            button.disabled = false;
            button.textContent = "Connect →";
          }
        });
    </script>
  </body>
</html>
